<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Ready Reply</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="brand" id="brand">Ready Reply</span>
      <div class="top-actions">
        <button type="button" class="icon-button" id="text-size">A+</button>
        <button type="button" class="icon-button" id="lang-toggle">EN</button>
        <button type="button" class="icon-button" id="logout" hidden></button>
      </div>
    </div>
    <div class="searchbar" id="searchbar" hidden>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" maxlength="200">
    </div>
  </header>
  <div class="layout">
    <nav class="nav" id="nav" hidden></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
